[project]
name = "lite2obj"
version = "1.0.0"
description = "Render .litematic schematics in 3D and export them to Blender (OBJ/MTL)"
readme = "README.md"
authors = [
    { name = "pinox12", email = "xavipi12@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pyside6-essentials>=6.12.0",
]

[project.scripts]
lite2obj = "lite2obj.cli:main"
lite2obj-gui = "lite2obj.gui:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
packaging = [
    "pyinstaller>=6.22",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.14"
files = ["src"]
ignore_missing_imports = true
