name: GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar la landing
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          # Habilita Pages con origen "GitHub Actions" si el repositorio aún no
          # lo tiene; sin esto el primer despliegue falla con un 404.
          enablement: true

      - name: Empaquetar docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
